name: Cleanup expired ads

on:
  schedule:
    - cron: "0 3 * * *"   # كل يوم على 3 ديال الصباح (UTC)
  workflow_dispatch:       # تقدر تشغلو يدوياً

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Delete expired ads
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cleanup.js
